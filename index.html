<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hiperfoco</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #161616;
      --muted: #6b7280;
      --line: #e5e7eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 560px;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      background: #fff;
    }

    .title {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 650;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .subtle {
      color: var(--muted);
      margin: 8px 0 20px;
      font-size: 0.95rem;
    }

    .daily {
      font-size: 2rem;
      margin: 10px 0 20px;
      font-weight: 700;
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      padding: 12px 14px;
      font-size: 1rem;
      font-weight: 550;
      cursor: pointer;
    }

    button:hover { background: #f9fafb; }

    .section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .meta {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .prompt {
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 12px;
      white-space: pre-line;
    }

    .choice {
      width: 100%;
      text-align: left;
      margin-bottom: 8px;
      font-weight: 450;
    }

    .result {
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 10px;
      min-height: 20px;
      white-space: pre-line;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="app">
    <section id="homeScreen">
      <h1 class="title">Hiperfoco em Medicina</h1>
      <p class="subtle">Ativador mental rápido. Sem metas, sem cobrança.</p>
      <div class="subtle">Acertos do dia</div>
      <div id="dailyAccuracy" class="daily">0%</div>
      <div class="stack">
        <button id="btn1">1 min</button>
        <button id="btn2">2 min</button>
      </div>
    </section>

    <section id="challengeScreen" class="hidden section">
      <div id="challengeMeta" class="meta"></div>
      <div id="challengePrompt" class="prompt"></div>
      <div id="challengeChoices"></div>
      <div class="stack">
        <button id="btnSkip">Ignorar</button>
        <button id="btnBack">Voltar</button>
      </div>
      <div id="challengeResult" class="result"></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "hiperfoco-events";
    const DAY_KEY = () => new Date().toISOString().slice(0, 10);

    const subjects = [
      { name: "Anatomia", weight: 55 },
      { name: "CHG", weight: 25 },
      { name: "Medicina comum", weight: 20 }
    ];

    const types = [
      { name: "flashcards", weight: 40 },
      { name: "questao", weight: 20 },
      { name: "texto", weight: 20 },
      { name: "video", weight: 20 }
    ];

    const dificuldadeFlashcards = [
      { name: "Fácil", weight: 60 },
      { name: "Média", weight: 20 },
      { name: "Difícil", weight: 20 }
    ];

    const miniConteudosAnatomiaFacil1Min = [
      "O sistema circulatório funciona como uma rede fechada de transporte. O coração bombeia o sangue, os vasos conduzem e o sangue leva oxigênio, nutrientes, hormônios e células de defesa para os tecidos, além de remover resíduos.",
      "A digestão começa na boca. Os dentes trituram o alimento, a saliva umedece e inicia a digestão química, e a língua organiza o bolo alimentar para a deglutição.",
      "O sistema respiratório não apenas leva ar aos pulmões: ele filtra, aquece e umedece o ar, participa da troca de gases, ajuda no controle do pH e contribui para o olfato e a voz.",
      "Os rins filtram o sangue, reabsorvem substâncias úteis e eliminam resíduos na urina. Também regulam pH, eletrólitos e volume sanguíneo, sendo essenciais para a homeostase.",
      "O esqueleto axial é o eixo do corpo e inclui crânio, coluna vertebral, costelas, esterno e hioide. Sua função principal é sustentar e proteger estruturas vitais.",
      "Músculo é um órgão ativo: contrai para gerar movimento, estabiliza posições e ajuda na produção de calor. O movimento corporal depende da integração entre músculos, ossos, articulações e sistema nervoso.",
      "O osso é um tecido vivo, vascularizado e em constante remodelação. Além de sustentar, participa da proteção, da reserva mineral e da produção de células sanguíneas.",
      "O sistema genital feminino produz gametas, secreta hormônios, permite fecundação e gestação e participa do parto e da amamentação.",
      "As articulações unem ossos e podem ser imóveis, semimóveis ou móveis. As articulações sinoviais têm maior mobilidade por possuírem cavidade articular e líquido sinovial."
    ];

    const flashcardsAnatomia = {
      "Fácil": [
        { frente: "Qual é a função geral do sistema circulatório?", verso: "Transportar sangue, oxigênio, nutrientes, hormônios, células de defesa e resíduos pelo corpo." },
        { frente: "Artéria sempre carrega sangue oxigenado?", verso: "Não. Artéria é o vaso que sai do coração, mesmo quando transporta sangue pobre em oxigênio." },
        { frente: "Onde ocorre a principal troca entre sangue e tecidos?", verso: "Nos capilares, por causa de suas paredes muito finas." },
        { frente: "Onde começa a digestão?", verso: "Na boca, com mastigação, saliva e início da digestão química." },
        { frente: "Quais são as principais glândulas salivares?", verso: "Parótida, submandibular e sublingual." },
        { frente: "Quais são as divisões da faringe?", verso: "Nasofaringe, orofaringe e laringofaringe." },
        { frente: "Qual é a função principal dos rins?", verso: "Filtrar o sangue, reabsorver substâncias úteis e eliminar resíduos pela urina." },
        { frente: "O que é o néfron?", verso: "É a unidade funcional do rim, responsável por filtrar e ajustar o filtrado." },
        { frente: "O que forma o esqueleto axial?", verso: "Crânio, coluna vertebral, hioide, costelas e esterno." },
        { frente: "Quais são as regiões da coluna vertebral?", verso: "Cervical, torácica, lombar, sacral e coccígea." },
        { frente: "O que é um músculo?", verso: "Um órgão ativo capaz de contrair e produzir movimento." },
        { frente: "Quais são as propriedades musculares?", verso: "Excitabilidade, condutividade, contratilidade, extensibilidade e elasticidade." },
        { frente: "Osso é tecido vivo?", verso: "Sim. Ele tem irrigação sanguínea, responde a estímulos e pode se regenerar." },
        { frente: "O que é o periósteo?", verso: "É a membrana que reveste externamente o osso." },
        { frente: "Quais são funções do sistema genital feminino?", verso: "Produzir gametas, permitir fecundação, gestação, parto e amamentação." },
        { frente: "Onde geralmente ocorre a fecundação?", verso: "Na ampola da tuba uterina." },
        { frente: "O que é uma articulação?", verso: "É a união entre ossos, com maior ou menor grau de movimento." },
        { frente: "Qual é a função dos ligamentos?", verso: "Unir ossos e limitar movimentos excessivos." }
      ],
      "Média": [
        { frente: "O que diferencia a circulação portal da circulação sistêmica comum?", verso: "Ela passa por dois leitos capilares antes de retornar ao coração, como no trajeto intestino-fígado." },
        { frente: "Por que a deglutição é um mecanismo de proteção?", verso: "Porque coordena estruturas como epiglote e palato para evitar entrada de alimento na via aérea." },
        { frente: "Quais substâncias endócrinas renais têm destaque clínico?", verso: "Renina, relacionada à pressão arterial, e eritropoetina, ligada à produção de hemácias." },
        { frente: "Por que unidades motoras pequenas permitem maior precisão?", verso: "Porque cada neurônio inerva menos fibras, refinando o controle do movimento." },
        { frente: "Quais estruturas compõem uma articulação sinovial?", verso: "Cavidade articular, cápsula, membrana sinovial, líquido sinovial e cartilagem." }
      ],
      "Difícil": [
        { frente: "Explique, de forma integrada, como parede vascular e pressão se relacionam entre artérias, veias e capilares.", verso: "Artérias têm paredes espessas para suportar alta pressão; veias operam em baixa pressão e contam com válvulas; capilares possuem parede muito fina para permitir trocas." },
        { frente: "Resuma a formação da urina destacando etapas e locais funcionais.", verso: "A urina resulta de filtração glomerular seguida de reabsorção e secreção tubular no néfron." },
        { frente: "Relacione fibras tipo I e IIB ao desempenho físico.", verso: "Tipo I: contração lenta e alta resistência à fadiga; tipo IIB: alta potência, metabolismo predominantemente anaeróbico e fadiga rápida." },
        { frente: "Compare sinartrose, anfiartrose e diartrose em termos de mobilidade e tecido predominante.", verso: "Sinartrose é imóvel e geralmente fibrosa; anfiartrose é semimóvel e geralmente cartilaginosa; diartrose é móvel e geralmente sinovial." },
        { frente: "Descreva a relevância anatômica do sacro na transmissão de cargas.", verso: "O sacro, formado por vértebras fundidas, transfere o peso do tronco para a pelve e membros inferiores, contribuindo para estabilidade pélvica." }
      ]
    };

    const placeholders = {
      flashcards: {
        title: "Flash-card rápido",
        prompt: "Flash-card 1/3\nTema: {{materia}}\n\n(Conteúdo será preenchido depois)",
        cards: 3
      },
      questao: {
        title: "Questão estilo House",
        prompt: "Paciente com dor torácica súbita e dispneia. Qual hipótese diagnóstica inicial é mais provável?",
        choices: ["TEP", "Asma leve", "Dengue", "Labirintite"],
        correctIndex: 0
      },
      texto: {
        title: "Texto curto",
        prompt: "Resumo de {{tempo}} de {{materia}}.\n\n(Conteúdo será preenchido depois)"
      },
      video: {
        title: "Vídeo curto",
        prompt: "Vídeo sugerido (30s–2min) sobre {{materia}}.\n\n(Link do YouTube será adicionado no banco depois)."
      }
    };

    let activeChallenge = null;

    const homeScreen = document.getElementById("homeScreen");
    const challengeScreen = document.getElementById("challengeScreen");
    const accuracyEl = document.getElementById("dailyAccuracy");
    const challengeMeta = document.getElementById("challengeMeta");
    const challengePrompt = document.getElementById("challengePrompt");
    const challengeChoices = document.getElementById("challengeChoices");
    const challengeResult = document.getElementById("challengeResult");

    function weightedPick(list) {
      const total = list.reduce((sum, item) => sum + item.weight, 0);
      let roll = Math.random() * total;
      for (const item of list) {
        roll -= item.weight;
        if (roll <= 0) return item.name;
      }
      return list[list.length - 1].name;
    }

    function pickRandom(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function buildChallenge(minutes) {
      const subject = weightedPick(subjects);
      const contentType = weightedPick(types);
      const base = placeholders[contentType];

      const challenge = {
        subject,
        contentType,
        minutes,
        title: base.title,
        prompt: base.prompt
          .replace(/{{materia}}/g, subject)
          .replace(/{{tempo}}/g, `${minutes} min`),
        choices: base.choices || null,
        correctIndex: base.correctIndex ?? null,
        cards: base.cards || null,
        difficulty: null,
        deck: null,
      };

      if (subject === "Anatomia" && contentType === "texto" && minutes === 1) {
        challenge.title = "Mini conteúdo de anatomia — leitura rápida";
        challenge.prompt = pickRandom(miniConteudosAnatomiaFacil1Min);
      }

      if (subject === "Anatomia" && contentType === "flashcards") {
        const difficulty = weightedPick(dificuldadeFlashcards);
        challenge.difficulty = difficulty;
        challenge.title = `Flashcards de Anatomia (${difficulty})`;

        const deck = flashcardsAnatomia[difficulty];
        challenge.deck = deck;
        challenge.cards = Math.min(3, deck.length);
        challenge.prompt = "Toque em um flashcard para abrir a pergunta e a resposta.";
      }

      return challenge;
    }

    function showChallenge(minutes) {
      activeChallenge = buildChallenge(minutes);
      homeScreen.classList.add("hidden");
      challengeScreen.classList.remove("hidden");
      challengeResult.textContent = "";

      const difficultyTag = activeChallenge.difficulty ? ` • ${activeChallenge.difficulty}` : "";
      challengeMeta.textContent = `${activeChallenge.subject} • ${activeChallenge.contentType}${difficultyTag} • ${activeChallenge.minutes} min`;
      challengePrompt.textContent = activeChallenge.prompt;
      challengeChoices.innerHTML = "";

      if (activeChallenge.cards) {
        const deck = activeChallenge.deck || [];
        for (let i = 0; i < activeChallenge.cards; i++) {
          const card = document.createElement("button");
          card.className = "choice";
          card.textContent = `Flashcard ${i + 1}`;
          card.onclick = () => {
            if (!deck.length) {
              challengeResult.textContent = "Flashcard aberto.";
              return;
            }
            const flash = deck[(Math.floor(Math.random() * deck.length) + i) % deck.length];
            challengeResult.textContent = `Frente: ${flash.frente}\nVerso: ${flash.verso}`;
          };
          challengeChoices.appendChild(card);
        }
      }

      if (activeChallenge.choices) {
        activeChallenge.choices.forEach((choice, index) => {
          const btn = document.createElement("button");
          btn.className = "choice";
          btn.textContent = choice;
          btn.onclick = () => answerQuestion(index === activeChallenge.correctIndex);
          challengeChoices.appendChild(btn);
        });
      }

      if (!activeChallenge.cards && !activeChallenge.choices) {
        const doneBtn = document.createElement("button");
        doneBtn.className = "choice";
        doneBtn.textContent = "Concluir";
        doneBtn.onclick = () => answerQuestion(true);
        challengeChoices.appendChild(doneBtn);
      }
    }

    function readEvents() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveEvent(event) {
      const events = readEvents();
      events.push(event);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    }

    function calculateDailyAccuracy() {
      const day = DAY_KEY();
      const events = readEvents().filter((e) => e.day === day && e.result !== "ignored");
      if (!events.length) return 0;
      const hits = events.filter((e) => e.result === "correct").length;
      return Math.round((hits / events.length) * 100);
    }

    function renderAccuracy() {
      accuracyEl.textContent = `${calculateDailyAccuracy()}%`;
    }

    function record(result) {
      if (!activeChallenge) return;
      saveEvent({
        day: DAY_KEY(),
        seenAt: new Date().toISOString(),
        subject: activeChallenge.subject,
        type: activeChallenge.contentType,
        chosenTime: activeChallenge.minutes,
        difficulty: activeChallenge.difficulty,
        viewedContent: activeChallenge.title,
        result,
      });
      renderAccuracy();
    }

    function answerQuestion(correct) {
      record(correct ? "correct" : "wrong");
      challengeResult.textContent = correct ? "Resposta registrada como acerto." : "Resposta registrada como erro.";
    }

    document.getElementById("btn1").onclick = () => showChallenge(1);
    document.getElementById("btn2").onclick = () => showChallenge(2);
    document.getElementById("btnSkip").onclick = () => {
      record("ignored");
      challengeResult.textContent = "Desafio ignorado.";
    };
    document.getElementById("btnBack").onclick = () => {
      challengeScreen.classList.add("hidden");
      homeScreen.classList.remove("hidden");
      activeChallenge = null;
    };

    renderAccuracy();
  </script>
</body>
</html>
