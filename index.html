<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P-hf | Produtividade Gamificada</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #515b78;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 900px;
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 32px;
      text-align: center;
    }

    .logo {
      font-size: clamp(64px, 16vw, 140px);
      font-weight: 900;
      letter-spacing: -5px;
    }

    .subtitle {
      font-size: clamp(28px, 7vw, 72px);
      font-weight: 900;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: 900;
      transition: 0.2s;
    }

    button:active {
      transform: scale(0.96);
    }

    .play-btn {
      background: white;
      color: #515b78;
      font-size: 28px;
      padding: 20px 48px;
      border-radius: 999px;
    }

    .tasks {
      width: 100%;
      max-width: 680px;
      display: none;
      flex-direction: column;
      gap: 18px;
      text-align: left;
    }

    .task-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: clamp(22px, 5vw, 42px);
      font-weight: 900;
      text-transform: uppercase;
    }

    .task input {
      width: 34px;
      height: 34px;
      accent-color: #ff8c22;
      flex-shrink: 0;
    }

    .task-dot {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffb21c, #ef3c7a);
      flex-shrink: 0;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .menu-toggle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ff8c22;
      color: white;
      font-size: 22px;
      line-height: 1;
      flex-shrink: 0;
    }

    .task-title {
      overflow-wrap: anywhere;
    }

    .mini-content {
      display: none;
      margin-left: 52px;
      border-left: 3px solid #ffb21c;
      padding-left: 14px;
      white-space: pre-line;
      font-size: clamp(14px, 2vw, 20px);
      line-height: 1.45;
      text-transform: none;
      font-weight: 700;
    }

    .mini-content.open {
      display: block;
    }

    .flashcard-content {
      background: #ffffff;
      color: #1d2438;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(15, 21, 43, 0.18);
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    .flashcard-front {
      font-size: clamp(24px, 3.4vw, 38px);
      font-weight: 900;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .flashcard-answer {
      display: none;
      padding-top: 14px;
      border-top: 2px solid #e8edf8;
      font-size: clamp(21px, 3vw, 32px);
      font-weight: 800;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .flashcard-answer.open {
      display: block;
    }

    .flashcard-toggle {
      align-self: center;
      background: #515b78;
      color: #ffffff;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: clamp(15px, 2vw, 20px);
      font-weight: 900;
    }

    .finish-btn {
      display: none;
      background: #ff8c22;
      color: white;
      font-size: 24px;
      padding: 18px 42px;
      border-radius: 999px;
      margin-top: 20px;
    }

    .result-screen {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 10;
      padding: 24px;
    }

    .result-screen.win {
      background: linear-gradient(120deg, #35d07f, #00d9ff);
      color: black;
    }

    .result-screen.lose {
      background: red;
      color: black;
    }

    .result-text {
      font-size: clamp(52px, 11vw, 160px);
      font-weight: 900;
      text-transform: uppercase;
    }

    .percent {
      font-size: clamp(28px, 6vw, 70px);
      margin-top: 20px;
      font-weight: 900;
    }

    .restart-btn {
      margin-top: 36px;
      background: black;
      color: white;
      padding: 16px 34px;
      border-radius: 999px;
      font-size: 20px;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px;
      }

      .app {
        min-height: 86vh;
      }

      .task {
        font-size: 24px;
      }

      .task-dot {
        width: 36px;
        height: 36px;
      }

      .task input {
        width: 28px;
        height: 28px;
      }

      .mini-content {
        margin-left: 0;
        padding-left: 10px;
      }

      .flashcard-content {
        padding: 16px;
        border-radius: 14px;
      }
    }
  </style>
</head>

    function sortearComPeso(lista) {
      const total = lista.reduce((soma, item) => soma + item.peso, 0);
      let sorteio = Math.random() * total;

      for (const item of lista) {
        sorteio -= item.peso;
        if (sorteio <= 0) return item.valor || item.nome;
      }
    }

    function criarConteudoMiniTarefa(conteudo) {
      const miniDiv = document.createElement("div");
      miniDiv.className = "mini-content";

      if (!conteudo) {
        return miniDiv;
      }

      if (conteudo.tipo === "flashcard") {
        const flashcard = document.createElement("article");
        flashcard.className = "flashcard-content";

        if (conteudo.id != null) {
          flashcard.dataset.flashcardId = String(conteudo.id);
        }

        const frente = document.createElement("p");
        frente.className = "flashcard-front";
        frente.textContent = conteudo.frente;

        const botaoResposta = document.createElement("button");
        botaoResposta.type = "button";
        botaoResposta.className = "flashcard-toggle";
        botaoResposta.textContent = "Mostrar resposta";

        const verso = document.createElement("p");
        verso.className = "flashcard-answer";
        verso.textContent = conteudo.verso;

        botaoResposta.addEventListener("click", () => {
          verso.classList.toggle("open");
          const respostaVisivel = verso.classList.contains("open");
          botaoResposta.textContent = respostaVisivel
            ? "Ocultar resposta"
            : "Mostrar resposta";
        });

        flashcard.appendChild(frente);
        flashcard.appendChild(botaoResposta);
        flashcard.appendChild(verso);
        miniDiv.appendChild(flashcard);
        return miniDiv;
      }

      miniDiv.textContent = conteudo.texto || "";
      return miniDiv;
    }

    function sortearTarefas() {
      const quantidade = sortearComPeso(pesosQuantidade);
      const tasksContainer = document.getElementById("tasks");

      tasksContainer.innerHTML = "";

      for (let i = 0; i < quantidade; i++) {
        const tarefa = sortearComPeso(pesosTarefas);
        const miniConteudo = (() => {
          if (tarefa === "Mini-conteúdo Anatomia") {
            return {
              tipo: "texto",
              texto: sortearComPeso(pesosMiniConteudosAnatomia)
            };
          }

          if (tarefa === "Flashcard Anatomia") {
            const flashcard = flashcardsAnatomia[
              Math.floor(Math.random() * flashcardsAnatomia.length)
            ];
            return {
              tipo: "flashcard",
              id: flashcard.id,
              frente: flashcard.frente,
              verso: flashcard.verso
            };
          }

          if (tarefa === "Caso estilo House") {
            const caso = casosEstiloHouse[
              Math.floor(Math.random() * casosEstiloHouse.length)
            ];
            return {
              tipo: "texto",
              texto: `${caso.caso}\n${caso.alternativas.join("\n")}\nResposta: ${caso.resposta}`
            };
          }

          return null;
        })();

        const item = document.createElement("div");
        item.className = "task-item";

        const div = document.createElement("div");
        div.className = "task";

        div.innerHTML = `
          <div class="task-left">
            <button type="button" class="menu-toggle" aria-label="Abrir conteúdo">+</button>
            <label class="task-left">
              <input type="checkbox" class="check" />
              <span class="task-title">${tarefa}</span>
            </label>
          </div>
          <div class="task-dot"></div>
        `;

        const miniDiv = criarConteudoMiniTarefa(miniConteudo);

        const toggleBtn = div.querySelector(".menu-toggle");

        if (miniConteudo) {
          toggleBtn.addEventListener("click", () => {
            miniDiv.classList.toggle("open");
            const aberto = miniDiv.classList.contains("open");
            toggleBtn.textContent = aberto ? "−" : "+";
            toggleBtn.setAttribute(
              "aria-label",
              aberto ? "Fechar conteúdo" : "Abrir conteúdo"
            );
          });
        } else {
          toggleBtn.disabled = true;
          toggleBtn.style.opacity = "0.5";
          toggleBtn.style.cursor = "not-allowed";
        }

        item.appendChild(div);
        item.appendChild(miniDiv);
        tasksContainer.appendChild(item);
      }

      document.getElementById("startScreen").style.display = "none";
      tasksContainer.style.display = "flex";
      document.getElementById("finishBtn").style.display = "block";
    }

    function concluir() {
      const checks = document.querySelectorAll(".check");
      const marcados = document.querySelectorAll(".check:checked");

      const total = checks.length;
      const acertos = marcados.length;
      const porcentagem = Math.round((acertos / total) * 100);

      const resultScreen = document.getElementById("resultScreen");
      const resultText = document.getElementById("resultText");
      const percentText = document.getElementById("percentText");

      if (porcentagem >= 60) {
        resultScreen.className = "result-screen win";
        resultText.textContent = "VOCÊ CONSEGUIU";
      } else {
        resultScreen.className = "result-screen lose";
        resultText.textContent = "VOCÊ PERDEU";
      }

      percentText.textContent = `${porcentagem}% de acerto`;
      resultScreen.style.display = "flex";
    }

    function reiniciar() {
      document.getElementById("resultScreen").style.display = "none";
      document.getElementById("tasks").style.display = "none";
      document.getElementById("finishBtn").style.display = "none";
      document.getElementById("startScreen").style.display = "block";
    }
