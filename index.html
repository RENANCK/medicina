<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P-hf | Produtividade Gamificada</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #515b78;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 900px;
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 32px;
      text-align: center;
    }

    .logo {
      font-size: clamp(64px, 16vw, 140px);
      font-weight: 900;
      letter-spacing: -5px;
    }

    .subtitle {
      font-size: clamp(28px, 7vw, 72px);
      font-weight: 900;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: 900;
      transition: 0.2s;
    }

    button:active {
      transform: scale(0.96);
    }

    .play-btn {
      background: white;
      color: #515b78;
      font-size: 28px;
      padding: 20px 48px;
      border-radius: 999px;
    }

    .tasks {
      width: 100%;
      max-width: 680px;
      display: none;
      flex-direction: column;
      gap: 18px;
      text-align: left;
    }

    .task {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: clamp(22px, 5vw, 42px);
      font-weight: 900;
      text-transform: uppercase;
    }

    .task input {
      width: 34px;
      height: 34px;
      accent-color: #ff8c22;
      flex-shrink: 0;
    }

    .task-dot {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffb21c, #ef3c7a);
      flex-shrink: 0;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .finish-btn {
      display: none;
      background: #ff8c22;
      color: white;
      font-size: 24px;
      padding: 18px 42px;
      border-radius: 999px;
      margin-top: 20px;
    }

    .result-screen {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 10;
      padding: 24px;
    }

    .result-screen.win {
      background: linear-gradient(120deg, #35d07f, #00d9ff);
      color: black;
    }

    .result-screen.lose {
      background: red;
      color: black;
    }

    .result-text {
      font-size: clamp(52px, 11vw, 160px);
      font-weight: 900;
      text-transform: uppercase;
    }

    .percent {
      font-size: clamp(28px, 6vw, 70px);
      margin-top: 20px;
      font-weight: 900;
    }

    .restart-btn {
      margin-top: 36px;
      background: black;
      color: white;
      padding: 16px 34px;
      border-radius: 999px;
      font-size: 20px;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px;
      }

      .app {
        min-height: 86vh;
      }

      .task {
        font-size: 24px;
      }

      .task-dot {
        width: 36px;
        height: 36px;
      }

      .task input {
        width: 28px;
        height: 28px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div id="startScreen">
      <div class="logo">P-hf</div>
      <div class="subtitle">PLAY</div>
      <br />
      <button class="play-btn" onclick="sortearTarefas()">SORTEAR</button>
    </div>

    <section id="tasks" class="tasks"></section>

    <button id="finishBtn" class="finish-btn" onclick="concluir()">CONCLUIR</button>
  </main>

  <section id="resultScreen" class="result-screen">
    <div>
      <div id="resultText" class="result-text"></div>
      <div id="percentText" class="percent"></div>
      <button class="restart-btn" onclick="reiniciar()">JOGAR DE NOVO</button>
    </div>
  </section>

  <script>
    const pesosQuantidade = [
      { valor: 3, peso: 8 },
      { valor: 4, peso: 7 },
      { valor: 5, peso: 30 },
      { valor: 6, peso: 15 },
      { valor: 7, peso: 17 },
      { valor: 8, peso: 12 },
      { valor: 9, peso: 3 },
      { valor: 10, peso: 2 },
      { valor: 11, peso: 2 },
      { valor: 12, peso: 2 }
    ];

    const pesosTarefas = [
      { nome: "Flashcard Anatomia", peso: 40 },
      { nome: "Flashcard CHG", peso: 30 },
      { nome: "Caso estilo House", peso: 12 },
      { nome: "Mini-conteúdo Anatomia", peso: 10 },
      { nome: "Mini-conteúdo CHG", peso: 8 }
    ];


    const miniConteudosAnatomia = [
      "Sistema Esquelético – Função: dá suporte ao corpo, protege órgãos, auxilia movimento, reserva minerais e participa da hematopoiese.",
      "Matriz Óssea: formada por parte orgânica (colágeno tipo I) e mineral (cálcio e fosfato), garantindo resistência ao osso.",
      "Cartilagem: tecido avascular e flexível que reduz impacto articular, nutre-se por difusão e é mais abundante em crianças.",
      "Osteoblastos: células formadoras do osso, produtoras da matriz óssea e ativas na regeneração de fraturas.",
      "Osteócitos: células ósseas maduras na matriz, essenciais para manutenção estrutural e troca de nutrientes.",
      "Osteoclastos: células grandes multinucleadas responsáveis pela reabsorção e remodelação óssea.",
      "Periósteo: camada externa vascularizada e inervada, importante para crescimento e regeneração óssea.",
      "Endósteo: reveste cavidades internas do osso, produz células ósseas e atua na remodelação.",
      "Osso Compacto: tecido denso e resistente da camada externa dos ossos, com poucos espaços.",
      "Osso Esponjoso: tecido leve com cavidades que abriga medula óssea e participa da hematopoiese.",
      "Ossos Longos: maiores no comprimento, como fêmur e úmero; possuem diáfise e epífise e auxiliam o movimento.",
      "Ossos Curtos: dimensões semelhantes e formato cúbico, como ossos do carpo, oferecendo estabilidade.",
      "Ossos Planos: finos e largos, como crânio e esterno, com função principal de proteção.",
      "Ossos Irregulares: ossos de formato complexo, como vértebras, com funções variadas.",
      "Ossos Pneumáticos: possuem cavidades com ar, reduzem o peso do crânio e se relacionam aos seios paranasais.",
      "Medula Óssea: tecido hematopoético vermelho ou amarelado dentro dos ossos, essencial à produção sanguínea.",
      "Coluna Vertebral: formada por vértebras, protege a medula espinal, permite movimentos e divide-se em regiões.",
      "Vértebras Cervicais: sete vértebras com forames transversos, incluindo atlas e áxis, para mobilidade do pescoço.",
      "Vértebras Torácicas: articulam-se com costelas, possuem fóveas costais e movimento mais limitado.",
      "Vértebras Lombares: grandes e fortes, com corpo volumoso para suporte de peso e flexão/extensão.",
      "Sacro: conjunto de vértebras fundidas que liga coluna e pelve, essencial para sustentação.",
      "Cóccix: porção final da coluna, pequena e triangular, sujeita à pressão ao sentar.",
      "Esterno: osso plano central do tórax que protege órgãos vitais e articula com costelas.",
      "Costelas: ossos curvos que protegem coração e pulmões e auxiliam a mecânica respiratória.",
      "Articulações: uniões entre ossos que permitem movimento, podendo ser móveis ou fixas.",
      "Articulação Sinovial: apresenta cápsula e líquido sinovial, com ampla mobilidade como no joelho.",
      "Articulação Fibrosa: união por tecido fibroso, com pouco ou nenhum movimento, como suturas cranianas.",
      "Articulação Cartilaginosa: união por cartilagem, com mobilidade limitada e absorção de impacto.",
      "Músculo Esquelético: tecido estriado voluntário ligado aos ossos para movimento corporal.",
      "Músculo Cardíaco: tecido do coração com contração involuntária rítmica e alta resistência.",
      "Músculo Liso: presente em vísceras, com contração lenta e involuntária, como no intestino.",
      "Fibras Musculares: células alongadas com actina e miosina, responsáveis pela contração.",
      "Sarcômero: unidade contrátil do músculo que encurta durante o esforço.",
      "Contração Muscular: depende de cálcio, interação actina-miosina e consumo de ATP.",
      "Sistema Respiratório: realiza trocas gasosas, fornece oxigênio, elimina CO₂ e contribui para equilíbrio do pH.",
      "Cavidade Nasal: filtra, aquece e umidifica o ar, participa do olfato e protege vias aéreas.",
      "Faringe: conduz ar e alimento, participa da deglutição e da defesa imunológica.",
      "Laringe: estrutura cartilaginosa da fonação que também protege vias respiratórias.",
      "Traqueia: tubo com anéis cartilaginosos que conduz ar aos brônquios e evita colapso.",
      "Pulmões: órgãos com alvéolos para troca gasosa; direito com 3 lobos e esquerdo com 2.",
      "Pleura: membrana com líquido lubrificante que reduz atrito na respiração.",
      "Inspiração: entrada de ar com contração do diafragma, aumento do volume torácico e queda de pressão.",
      "Expiração: saída de ar com relaxamento do diafragma e redução do volume torácico.",
      "Sistema Circulatório: transporta sangue, nutrientes e resíduos, mantendo homeostase.",
      "Artérias: vasos de alta pressão que levam sangue do coração, com paredes espessas e elásticas.",
      "Veias: vasos de baixa pressão que trazem sangue ao coração e possuem válvulas.",
      "Capilares: vasos finos entre artérias e veias onde ocorrem trocas por difusão.",
      "Hematopoiese: formação de células sanguíneas na medula óssea, incluindo hemácias e leucócitos.",
      "Sistema Linfático: transporta linfa, auxilia defesa e remove excesso de líquido tecidual.",
      "Homeostase: manutenção do equilíbrio interno, incluindo pH, temperatura e funções vitais."
    ];

    const pesosMiniConteudosAnatomia = miniConteudosAnatomia.map((conteudo) => ({
      nome: conteudo,
      peso: 1
    }));

    function sortearComPeso(lista) {
      const total = lista.reduce((soma, item) => soma + item.peso, 0);
      let sorteio = Math.random() * total;

      for (const item of lista) {
        sorteio -= item.peso;
        if (sorteio <= 0) return item.valor || item.nome;
      }
    }

    function sortearTarefas() {
      const quantidade = sortearComPeso(pesosQuantidade);
      const tasksContainer = document.getElementById("tasks");

      tasksContainer.innerHTML = "";

      for (let i = 0; i < quantidade; i++) {
        const tarefa = sortearComPeso(pesosTarefas);
        const textoTarefa =
          tarefa === "Mini-conteúdo Anatomia"
            ? `Mini Anatomia: ${sortearComPeso(pesosMiniConteudosAnatomia)}`
            : tarefa;

        const div = document.createElement("div");
        div.className = "task";

        div.innerHTML = `
          <label class="task-left">
            <input type="checkbox" class="check" />
            <span>${textoTarefa}</span>
          </label>
          <div class="task-dot"></div>
        `;

        tasksContainer.appendChild(div);
      }

      document.getElementById("startScreen").style.display = "none";
      tasksContainer.style.display = "flex";
      document.getElementById("finishBtn").style.display = "block";
    }

    function concluir() {
      const checks = document.querySelectorAll(".check");
      const marcados = document.querySelectorAll(".check:checked");

      const total = checks.length;
      const acertos = marcados.length;
      const porcentagem = Math.round((acertos / total) * 100);

      const resultScreen = document.getElementById("resultScreen");
      const resultText = document.getElementById("resultText");
      const percentText = document.getElementById("percentText");

      if (porcentagem >= 60) {
        resultScreen.className = "result-screen win";
        resultText.textContent = "VOCÊ CONSEGUIU";
      } else {
        resultScreen.className = "result-screen lose";
        resultText.textContent = "VOCÊ PERDEU";
      }

      percentText.textContent = `${porcentagem}% de acerto`;
      resultScreen.style.display = "flex";
    }

    function reiniciar() {
      document.getElementById("resultScreen").style.display = "none";
      document.getElementById("tasks").style.display = "none";
      document.getElementById("finishBtn").style.display = "none";
      document.getElementById("startScreen").style.display = "block";
    }
  </script>
</body>
</html>
