<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P-hf | Produtividade Gamificada</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #515b78;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 900px;
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 32px;
      text-align: center;
    }

    .logo {
      font-size: clamp(64px, 16vw, 140px);
      font-weight: 900;
      letter-spacing: -5px;
    }

    .subtitle {
      font-size: clamp(28px, 7vw, 72px);
      font-weight: 900;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: 900;
      transition: 0.2s;
    }

    button:active {
      transform: scale(0.96);
    }

    .play-btn {
      background: white;
      color: #515b78;
      font-size: 28px;
      padding: 20px 48px;
      border-radius: 999px;
    }

    .tasks {
      width: 100%;
      max-width: 680px;
      display: none;
      flex-direction: column;
      gap: 18px;
      text-align: left;
    }

    .task-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: clamp(22px, 5vw, 42px);
      font-weight: 900;
      text-transform: uppercase;
    }

    .task input {
      width: 34px;
      height: 34px;
      accent-color: #ff8c22;
      flex-shrink: 0;
    }

    .task-dot {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffb21c, #ef3c7a);
      flex-shrink: 0;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .menu-toggle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ff8c22;
      color: white;
      font-size: 22px;
      line-height: 1;
      flex-shrink: 0;
    }

    .task-title {
      overflow-wrap: anywhere;
    }

    .mini-content {
      display: none;
      margin-left: 52px;
      border-left: 3px solid #ffb21c;
      padding-left: 14px;
      white-space: pre-line;
      font-size: clamp(20px, 3.2vw, 34px);
      line-height: 1.45;
      text-transform: none;
      font-weight: 700;
    }
    .mini-content.active-reading {
      background: #ffffff;
      color: #1d2438;
      border-radius: 16px;
      border-left: none;
      padding: 22px;
      margin-left: 0;
      box-shadow: 0 8px 24px rgba(15, 21, 43, 0.15);
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .mini-reading-text {
      font-size: clamp(21px, 3vw, 33px);
      line-height: 1.5;
      white-space: pre-line;
      font-weight: 700;
    }
    .mini-reading-input {
      width: 100%;
      border: 2px solid #cfd7eb;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: clamp(16px, 2.3vw, 22px);
      font-weight: 700;
    }
    .mini-reading-btn {
      align-self: flex-start;
      background: #515b78;
      color: #ffffff;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: clamp(15px, 2vw, 20px);
      font-weight: 900;
    }
    .mini-reading-feedback {
      font-size: clamp(15px, 2.1vw, 20px);
      font-weight: 800;
      color: #1d2438;
    }

    .mini-content.open {
      display: block;
    }

    .flashcard-content {
      background: #ffffff;
      color: #1d2438;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(15, 21, 43, 0.18);
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    .flashcard-front {
      font-size: clamp(24px, 3.4vw, 38px);
      font-weight: 900;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .flashcard-answer {
      display: none;
      padding-top: 14px;
      border-top: 2px solid #e8edf8;
      font-size: clamp(21px, 3vw, 32px);
      font-weight: 800;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .flashcard-answer.open {
      display: block;
    }

    .flashcard-toggle {
      align-self: center;
      background: #515b78;
      color: #ffffff;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: clamp(15px, 2vw, 20px);
      font-weight: 900;
    }
    .house-case-content {
      background: #ffffff;
      color: #1d2438;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(15, 21, 43, 0.18);
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: left;
    }
    .house-case-title {
      font-size: clamp(24px, 3.4vw, 38px);
      font-weight: 900;
      line-height: 1.25;
    }
    .house-case-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .house-case-option {
      width: 100%;
      text-align: left;
      background: #eef2ff;
      color: #1d2438;
      border: 2px solid #cfd7eb;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: clamp(17px, 2.4vw, 25px);
      font-weight: 800;
    }
    .house-case-option.correct {
      background: #2bb673;
      border-color: #1f935b;
      color: #ffffff;
    }
    .house-case-option.wrong {
      background: #d84040;
      border-color: #aa2f2f;
      color: #ffffff;
    }

    .finish-btn {
      display: none;
      background: #ff8c22;
      color: white;
      font-size: 24px;
      padding: 18px 42px;
      border-radius: 999px;
      margin-top: 20px;
    }

    .result-screen {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 10;
      padding: 24px;
    }

    .result-screen.win {
      background: linear-gradient(120deg, #35d07f, #00d9ff);
      color: black;
    }

    .result-screen.lose {
      background: red;
      color: black;
    }

    .result-text {
      font-size: clamp(52px, 11vw, 160px);
      font-weight: 900;
      text-transform: uppercase;
    }

    .percent {
      font-size: clamp(28px, 6vw, 70px);
      margin-top: 20px;
      font-weight: 900;
    }

    .restart-btn {
      margin-top: 36px;
      background: black;
      color: white;
      padding: 16px 34px;
      border-radius: 999px;
      font-size: 20px;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px;
      }

      .app {
        min-height: 86vh;
      }

      .task {
        font-size: 24px;
      }

      .task-dot {
        width: 36px;
        height: 36px;
      }

      .task input {
        width: 28px;
        height: 28px;
      }

      .mini-content {
        margin-left: 0;
        padding-left: 10px;
      }

      .flashcard-content {
        padding: 16px;
        border-radius: 14px;
      }
    }
  </style>
</head>

      `28. Secreção Apócrina

      `29. Glândulas Simples e Compostas
Glândulas simples possuem um único ducto não ramificado.
Glândulas compostas possuem ductos ramificados e maior complexidade estrutural.`,
      `30. Tecido Conjuntivo
O tecido conjuntivo possui abundante matriz extracelular composta por fibras e substância fundamental.`,
      `31. Fibras Colágenas
Fibras colágenas são responsáveis pela resistência à tração e são formadas por colágeno.`,
      `32. Colágeno e Vitamina C
A síntese de colágeno depende da vitamina C; sua deficiência leva ao escorbuto.`,
      `33. Fibras Reticulares
Fibras reticulares são formadas por colágeno tipo III e formam redes de sustentação.`,
      `34. Fibras Elásticas
Fibras elásticas permitem que o tecido se estique e retorne à forma original.`,
      `35. Substância Fundamental Amorfa
A substância fundamental amorfa é viscosa e atua como meio de difusão e proteção.`,
      `36. Fibroblastos e Fibrócitos

      `37. Adipócitos

      `38. Mastócitos

      `39. Macrófagos
Macrófagos realizam fagocitose, eliminando partículas estranhas e restos celulares.`,
      `40. Plasmócitos e Leucócitos
Plasmócitos são responsáveis pela produção de anticorpos.
Leucócitos migram para o tecido conjuntivo por diapedese, atuando na defesa do organismo.`,
      `41. Conjuntivo Frouxo e Denso
Tecido conjuntivo frouxo possui fibras finas e é mais flexível.
Tecido conjuntivo denso possui fibras grossas e maior resistência à tração.`,
      `42. Tecido Adiposo
O tecido adiposo unilocular armazena energia e atua no isolamento térmico.
O tecido adiposo multilocular produz calor através da termogênese.`,
      `43. Cartilagem
A cartilagem é um tecido avascular composto por condrócitos e matriz rica em colágeno.`,
      `44. Tecido Ósseo
O tecido ósseo fornece suporte, proteção e armazenamento de minerais como cálcio.`,
      `45. Calcitonina e Paratormônio
A calcitonina reduz o cálcio sanguíneo, enquanto o paratormônio aumenta sua concentração.`

    function sortearComPeso(lista) {
      const total = lista.reduce((soma, item) => soma + item.peso, 0);
      let sorteio = Math.random() * total;

      for (const item of lista) {
        sorteio -= item.peso;
        if (sorteio <= 0) return item.valor || item.nome;
      }
    }

    const stopWordsMini = new Set(["de", "do", "da", "e", "o", "a", "em", "um", "uma", "para"]);

    function normalizarResposta(texto) {
      return (texto || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function escolherDuasPalavrasAleatorias(texto) {
      const regex = /\p{L}+/gu;
      const palavras = [];
      let match;
      while ((match = regex.exec(texto)) !== null) {
        const palavra = match[0];
        const normalizada = normalizarResposta(palavra);
        if (normalizada.length < 4) continue;
        if (stopWordsMini.has(normalizada)) continue;
        palavras.push({ palavraOriginal: palavra, palavraNormalizada: normalizada, inicio: match.index, fim: regex.lastIndex });
      }
      const unicas = palavras.filter((item, idx, arr) => arr.findIndex((x) => x.palavraNormalizada === item.palavraNormalizada) === idx);
      const base = unicas.length >= 2 ? unicas : palavras;
      if (base.length < 2) return null;
      const primeira = base[Math.floor(Math.random() * base.length)];
      let segunda = base[Math.floor(Math.random() * base.length)];
      while (segunda.palavraNormalizada === primeira.palavraNormalizada) {
        segunda = base[Math.floor(Math.random() * base.length)];
      }
      return [primeira, segunda].sort((a, b) => a.inicio - b.inicio);
    }

    function mascararMiniConteudo(texto, palavrasOcultas) {
      const partes = [];
      let cursor = 0;
      palavrasOcultas.forEach((palavra, idx) => {
        partes.push(texto.slice(cursor, palavra.inicio));
        partes.push(`__BLANK_${idx}__`);
        cursor = palavra.fim;
      });
      partes.push(texto.slice(cursor));
      return partes.join("");
    }

    function registrarPontoDoDia() {
      const hoje = new Date().toISOString().slice(0, 10);
      const chave = `hiperfoco-pontos-${hoje}`;
      const atual = Number(localStorage.getItem(chave) || "0");
      localStorage.setItem(chave, String(atual + 1));
    }

    function criarConteudoMiniTarefa(conteudo) {
      const miniDiv = document.createElement("div");
      miniDiv.className = "mini-content";

      if (!conteudo) {
        return miniDiv;
      }

      if (conteudo.tipo === "flashcard") {
        const flashcard = document.createElement("article");
        flashcard.className = "flashcard-content";

        if (conteudo.id != null) {
          flashcard.dataset.flashcardId = String(conteudo.id);
        }

        const frente = document.createElement("p");
        frente.className = "flashcard-front";
        frente.textContent = conteudo.frente;

        const botaoResposta = document.createElement("button");
        botaoResposta.type = "button";
        botaoResposta.className = "flashcard-toggle";
        botaoResposta.textContent = "Mostrar resposta";

        const verso = document.createElement("p");
        verso.className = "flashcard-answer";
        verso.textContent = conteudo.verso;

        botaoResposta.addEventListener("click", () => {
          verso.classList.toggle("open");
          const respostaVisivel = verso.classList.contains("open");
          botaoResposta.textContent = respostaVisivel
            ? "Ocultar resposta"
            : "Mostrar resposta";
        });

        flashcard.appendChild(frente);
        flashcard.appendChild(botaoResposta);
        flashcard.appendChild(verso);
        miniDiv.appendChild(flashcard);
        return miniDiv;
      }

      if (conteudo.tipo === "mini-conteudo") {
        miniDiv.classList.add("active-reading");
        const state = { fase: "leitura", concluiu: false };
        const texto = document.createElement("p");
        texto.className = "mini-reading-text";
        texto.textContent = conteudo.texto || "";
        const acaoBtn = document.createElement("button");
        acaoBtn.type = "button";
        acaoBtn.className = "mini-reading-btn";
        acaoBtn.textContent = "Li uma vez";
        const feedback = document.createElement("p");
        feedback.className = "mini-reading-feedback";

        const renderInputs = (mascarado) => {
          texto.innerHTML = "";
          mascarado.split(/(__BLANK_[01]__)/g).forEach((parte) => {
            if (parte === "__BLANK_0__" || parte === "__BLANK_1__") {
              const input = document.createElement("input");
              input.type = "text";
              input.className = "mini-reading-input";
              input.placeholder = "Digite a palavra";
              input.dataset.blank = parte === "__BLANK_0__" ? "0" : "1";
              texto.appendChild(input);
            } else if (parte) {
              texto.appendChild(document.createTextNode(parte));
            }
          });
        };

        acaoBtn.addEventListener("click", () => {
          if (state.fase === "leitura") {
            const sorteadas = escolherDuasPalavrasAleatorias(conteudo.texto || "");
            if (!sorteadas) {
              feedback.textContent = "Não foi possível ocultar 2 palavras neste texto.";
              return;
            }
            state.ocultas = sorteadas;
            renderInputs(mascararMiniConteudo(conteudo.texto || "", sorteadas));
            state.fase = "resposta";
            acaoBtn.textContent = "Responder";
            return;
          }

          if (state.fase === "resposta") {
            const i0 = texto.querySelector('input[data-blank="0"]');
            const i1 = texto.querySelector('input[data-blank="1"]');
            const resposta0 = normalizarResposta(i0?.value);
            const resposta1 = normalizarResposta(i1?.value);
            const correto0 = resposta0 === state.ocultas[0].palavraNormalizada;
            const correto1 = resposta1 === state.ocultas[1].palavraNormalizada;
            if (correto0 && correto1) {
              feedback.textContent = "Correto! +1 ponto.";
              registrarPontoDoDia();
            } else {
              feedback.textContent = `Resposta: ${state.ocultas[0].palavraOriginal} | ${state.ocultas[1].palavraOriginal}`;
            }
            state.fase = "continuar";
            acaoBtn.textContent = "Continuar";
            return;
          }

          if (state.fase === "continuar") {
            if (!state.concluiu) {
              state.concluiu = true;
            }
            feedback.textContent = "Conteúdo concluído.";
            acaoBtn.disabled = true;
          }
        });

        miniDiv.appendChild(texto);
        miniDiv.appendChild(acaoBtn);
        miniDiv.appendChild(feedback);
        return miniDiv;
      }

      if (conteudo.tipo === "house-case") {
        const card = document.createElement("article");
        card.className = "house-case-content";

        const enunciado = document.createElement("p");
        enunciado.className = "house-case-title";
        enunciado.textContent = conteudo.caso;

        const opcoes = document.createElement("div");
        opcoes.className = "house-case-options";

        const botoes = conteudo.alternativas.map((alternativa) => {
          const botao = document.createElement("button");
          botao.type = "button";
          botao.className = "house-case-option";
          botao.textContent = alternativa;

          botao.addEventListener("click", () => {
            const acertou = alternativa === conteudo.resposta;
            botao.classList.add(acertou ? "correct" : "wrong");
            botoes.forEach((item) => {
              item.disabled = true;
            });
          });

          opcoes.appendChild(botao);
          return botao;
        });

        card.appendChild(enunciado);
        card.appendChild(opcoes);
        miniDiv.appendChild(card);
        return miniDiv;
      }

      miniDiv.textContent = conteudo.texto || "";
      return miniDiv;
    }

    function sortearTarefas() {
      const quantidade = sortearComPeso(pesosQuantidade);
      const tasksContainer = document.getElementById("tasks");

      tasksContainer.innerHTML = "";

      for (let i = 0; i < quantidade; i++) {
        const tarefa = sortearComPeso(pesosTarefas);
        const miniConteudo = (() => {
          if (tarefa === "Mini-conteúdo Anatomia") {
            return {
              tipo: "mini-conteudo",
              texto: sortearComPeso(pesosMiniConteudosAnatomia)
            };
          }

          if (tarefa === "Mini-conteúdo CHG") {
            return {
              tipo: "mini-conteudo",
              texto: sortearComPeso(pesosMiniConteudosCHG)
            };
          }

          if (tarefa === "Flashcard Anatomia") {
            const flashcard = flashcardsAnatomia[
              Math.floor(Math.random() * flashcardsAnatomia.length)
            ];
            return {
              tipo: "flashcard",
              id: flashcard.id,
              frente: flashcard.frente,
              verso: flashcard.verso
            };
          }

          if (tarefa === "Flashcard CHG") {
            const flashcard = flashcardsCHG[
              Math.floor(Math.random() * flashcardsCHG.length)
            ];
            return {
              tipo: "flashcard",
              frente: flashcard.frente,
              verso: flashcard.verso
            };
          }

          if (tarefa === "Caso estilo House") {
            const caso = casosEstiloHouse[
              Math.floor(Math.random() * casosEstiloHouse.length)
            ];
            return {
              tipo: "house-case",
              caso: caso.caso,
              alternativas: caso.alternativas,
              resposta: caso.resposta
            };
          }

          return null;
        })();

        const item = document.createElement("div");
        item.className = "task-item";

        const div = document.createElement("div");
        div.className = "task";

        div.innerHTML = `
          <div class="task-left">
            <button type="button" class="menu-toggle" aria-label="Abrir conteúdo">+</button>
            <label class="task-left">
              <input type="checkbox" class="check" />
              <span class="task-title">${tarefa}</span>
            </label>
          </div>
          <div class="task-dot"></div>
        `;

        const miniDiv = criarConteudoMiniTarefa(miniConteudo);

        const toggleBtn = div.querySelector(".menu-toggle");

        if (miniConteudo) {
          toggleBtn.addEventListener("click", () => {
            miniDiv.classList.toggle("open");
            const aberto = miniDiv.classList.contains("open");
            toggleBtn.textContent = aberto ? "−" : "+";
            toggleBtn.setAttribute(
              "aria-label",
              aberto ? "Fechar conteúdo" : "Abrir conteúdo"
            );
          });
        } else {
          toggleBtn.disabled = true;
          toggleBtn.style.opacity = "0.5";
          toggleBtn.style.cursor = "not-allowed";
        }

        item.appendChild(div);
        item.appendChild(miniDiv);
        tasksContainer.appendChild(item);
      }

      document.getElementById("startScreen").style.display = "none";
      tasksContainer.style.display = "flex";
      document.getElementById("finishBtn").style.display = "block";
    }

    function concluir() {
      const checks = document.querySelectorAll(".check");
      const marcados = document.querySelectorAll(".check:checked");

      const total = checks.length;
      const acertos = marcados.length;
      const porcentagem = Math.round((acertos / total) * 100);

      const resultScreen = document.getElementById("resultScreen");
      const resultText = document.getElementById("resultText");
      const percentText = document.getElementById("percentText");

      if (porcentagem >= 60) {
        resultScreen.className = "result-screen win";
        resultText.textContent = "VOCÊ CONSEGUIU";
      } else {
        resultScreen.className = "result-screen lose";
        resultText.textContent = "VOCÊ PERDEU";
      }

      percentText.textContent = `${porcentagem}% de acerto`;
      resultScreen.style.display = "flex";
    }

    function reiniciar() {
      document.getElementById("resultScreen").style.display = "none";
      document.getElementById("tasks").style.display = "none";
      document.getElementById("finishBtn").style.display = "none";
      document.getElementById("startScreen").style.display = "block";
    }
  </script>
